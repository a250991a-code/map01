<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>アニメ聖地マップ</title>

<link href="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.css" rel="stylesheet">

<style>
body {
  margin: 0;
}

#map {
  width: 100vw;
  height: 100vh;
}

.anime-marker {
  font-size: 28px;
  cursor: pointer;
  text-shadow: 0 0 5px white;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.js"></script>

<script>

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/bright',
  center: [139.7671, 35.6812],
  zoom: 4
});

map.addControl(new maplibregl.NavigationControl());

const locations = [
  {
    lng: 139.7737,
    lat: 35.6982,
    name: "秋葉原、東京",
    text: "日本アニメの中心",
    icon: "🎬"
  },
  {
    lng: 138.0837,
    lat: 36.0486,
    name: "諏訪湖、長野",
    text: "君の名は。の舞台",
    icon: "⭐"
  },
  {
    lng: 139.7203,
    lat: 35.6854,
    name: "四谷須賀神社、東京新宿",
    text: "君の名は。の舞台で作中でも特に印象的",
    icon: "⭐"
  },
  {
    lng: 139.9141,
    lat: 37.3668,
    name: "大川荘、福島",
    text: "鬼滅の刃に出てくる無限城",
    icon: "⚔️"
  },
  {
    lng: 132.7863,
    lat: 33.8520,
    name: "道後温泉本館、愛媛",
    text: "千と千尋の神隠しの舞台",
    icon: "♨️"
  },
  {
    lng: 139.0024,
    lat: 35.2794,
    name: "公時神社、神奈川",
    text: "エヴァンゲリオンの舞台",
    icon: "🤖"
  },
  {
    lng: 131.1587,
    lat: 33.2811,
    name: "旧豊後森機関庫、大分",
    text: "すずめの戸締りの舞台",
    icon: "🚪"
  },
  {
    lng: 139.0894,
    lat: 35.9883,
    name: "羊山公園、埼玉",
    text: "あの日見た花の名前を僕達はまだ知らない。の聖地",
    icon: "🌸"
  },
  {
    lng: 139.5199,
    lat: 36.3143,
    name: "あしかがフラワーパーク、栃木",
    text: "鬼滅の刃の最終選抜のモデル場所。藤の花が咲いている。",
    icon: "💜"
  }
];

locations.forEach(loc => {

  const markerElement = document.createElement("div");
  markerElement.className = "anime-marker";
  markerElement.textContent = loc.icon;

  new maplibregl.Marker({
    element: markerElement
  })
    .setLngLat([loc.lng, loc.lat])
    .setPopup(
      new maplibregl.Popup().setHTML(`
        <h3>${loc.name}</h3>
        <p>${loc.text}</p>
      `)
    )
    .addTo(map);
});

</script>

</body>
</html>
